<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="80%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes orbitNodes {
        0% { transform: rotate(0deg) translate(25px) rotate(0deg); }
        100% { transform: rotate(360deg) translate(25px) rotate(-360deg); }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      .anim-glow-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 250px 120px; }
      .anim-glow-2 { animation: pulseGlow 7s ease-in-out infinite alternate; transform-origin: 950px 180px; }
      .p1 { animation: floatParticle 4s ease-in-out infinite; }
      .p2 { animation: floatParticle 5s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .p4 { animation: floatParticle 4.5s ease-in-out infinite 1.5s; }
      .orbit-node { animation: orbitNodes 10s linear infinite; transform-origin: 1060px 100px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; fill: #94a3b8; letter-spacing: 0.5px; }
      .pill { rx: 16; ry: 16; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- Dynamic Ambient Glows -->
  <ellipse class="anim-glow-1" cx="240" cy="130" rx="280" ry="180" fill="url(#glowCyan)"/>
  <ellipse class="anim-glow-2" cx="960" cy="200" rx="320" ry="200" fill="url(#glowPurple)"/>

  <!-- Constellation Network / Research Mesh Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="380" y2="90"/>
    <line x1="380" y1="90" x2="520" y2="170"/>
    <line x1="820" y1="90" x2="960" y2="160"/>
    <line x1="960" y1="160" x2="1100" y2="80"/>
    <line x1="960" y1="160" x2="1040" y2="280"/>
    <line x1="160" y1="300" x2="220" y2="160"/>
  </g>

  <!-- Floating Network Particles -->
  <circle class="p1" cx="80" cy="80" r="4" fill="#38bdf8"/>
  <circle class="p2" cx="220" cy="160" r="5" fill="#818cf8"/>
  <circle class="p3" cx="380" cy="90" r="3.5" fill="#c084fc"/>
  <circle class="p4" cx="520" cy="170" r="4" fill="#f472b6"/>
  <circle class="p2" cx="820" cy="90" r="4" fill="#60a5fa"/>
  <circle class="p1" cx="960" cy="160" r="5.5" fill="#a855f7"/>
  <circle class="p3" cx="1100" cy="80" r="4" fill="#ec4899"/>
  <circle class="p4" cx="1040" cy="280" r="4.5" fill="#38bdf8"/>
  <circle class="p2" cx="160" cy="300" r="4" fill="#34d399"/>

  <!-- Decorative Orbiting Satellite Icon Top-Right -->
  <g>
    <circle cx="1060" cy="100" r="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="1060" y="108" font-family="'Segoe UI Emoji', sans-serif" font-size="20" text-anchor="middle">🔬</text>
    <circle class="orbit-node" cx="1060" cy="100" r="4.5" fill="#38bdf8" filter="url(#glowEffect)"/>
  </g>

  <!-- Card Border Outline -->
  <rect x="15" y="15" width="1170" height="370" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Header Category Badge -->
  <g transform="translate(60, 50)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">CURATED KNOWLEDGE BASE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 140)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      Awesome Research Administration
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 190)">
    <text class="subtitle">
      Enterprise SaaS Suites &amp; Open-Source Ecosystem for eRA, Grants Lifecycle, Compliance &amp; Scholarly Assets
    </text>
  </g>

  <!-- Feature Tags / Metric Pills -->
  <g transform="translate(60, 245)">
    <!-- Pill 1: Grants & eRA -->
    <g transform="translate(0, 0)">
      <rect class="pill" width="220" height="42" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="20" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="16">🏛️</text>
      <text x="46" y="26" class="badge-text">Grants Lifecycle &amp; eRA</text>
    </g>

    <!-- Pill 2: IRB & Compliance -->
    <g transform="translate(235, 0)">
      <rect class="pill" width="220" height="42" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="20" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="16">⚖️</text>
      <text x="46" y="26" class="badge-text">IRB, COI &amp; Compliance</text>
    </g>

    <!-- Pill 3: Pre & Post Award -->
    <g transform="translate(470, 0)">
      <rect class="pill" width="225" height="42" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.5"/>
      <text x="20" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="16">📊</text>
      <text x="46" y="26" class="badge-text">Pre- &amp; Post-Award Mgmt</text>
    </g>

    <!-- Pill 4: Open Research & Data -->
    <g transform="translate(710, 0)">
      <rect class="pill" width="235" height="42" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="20" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="16">🔓</text>
      <text x="46" y="26" class="badge-text">Research Repositories &amp; RIM</text>
    </g>
  </g>

  <!-- Bottom Meta Bar -->
  <g transform="translate(60, 335)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#334155" stroke-opacity="0.6"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
      ⚡ Comprehensive Comparison • Transparent Starting Tier Pricing • Verified Institutional Limits • GitHub Stargazers
    </text>
  </g>
</svg>
